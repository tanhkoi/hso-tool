<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"> 
 <title id="title">HSO dashboard UI/UX redesign mockup</title> 
 <desc id="desc">Dark green desktop dashboard concept for HSO gear and weapon stats, with navigation, filters, a data table, and a utility panel.</desc> 
 <defs> 
